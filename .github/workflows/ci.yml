name: CI

on:
  push:
    branches:
      - main
      # dev too: what a merge produces is tested before deploy.yml sends it to preprod.
      - dev
  pull_request: ~
  workflow_dispatch: ~

permissions:
  contents: read

# Actions pinned by commit: on dev and main these jobs share the GHA cache of the run that
# builds and deploys the image (Dependabot keeps them up to date).
#
# A pull request cancels its previous run. Pushes to a branch queue up instead, so their
# deploys reach the VPS in order (deploy.sh refuses to go back).
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    env:
      # The compose file defaults HTTP to 81 for local use; CI checks the standard port.
      HTTP_PORT: 80
      HTTPS_PORT: 443
      HTTP3_PORT: 443
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build Docker images
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        with:
          pull: true
          load: true
          source: .
          files: |
            compose.yaml
            compose.override.yaml
          set: |
            *.cache-from=type=gha,scope=${{github.ref}}
            *.cache-from=type=gha,scope=refs/heads/main
            *.cache-to=type=gha,scope=${{github.ref}},mode=max
      - name: Start services
        run: docker compose up --wait --no-build
      - name: Check HTTP reachability
        run: curl -v --fail-with-body -o /dev/null http://localhost
      - name: Check HTTPS reachability
        # TLS reachability only, no --fail-with-body: at this point the assets are not built
        # and the dev database is not migrated, so the homepage itself answers 500.
        run: curl -v --insecure -o /dev/null https://localhost
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: yarn
      - name: Test YARN
        run: yarn install --frozen-lockfile && yarn dev
      - name: Create test database
        run: docker compose exec -T php bin/console -e test doctrine:database:create
      - name: Run migrations
        run: docker compose exec -T php bin/console -e test doctrine:migrations:migrate --no-interaction
      - name: Load Fixtures
        run: docker compose exec -T php bin/console -e test hautelook:fixtures:load --no-interaction
      - name: Run PHPUnit
        run: docker compose exec -T php bin/phpunit
      - name: PHPStan
        # The container's CLI memory_limit is 128M, which PHPStan overruns on this codebase.
        run: docker compose exec -T php vendor/bin/phpstan analyse --memory-limit=-1
      - name: PHP-CS-Fixer
        run: docker compose exec -T php vendor/bin/php-cs-fixer fix --dry-run --diff
      - name: Doctrine Schema Validator
        run: docker compose exec -T php bin/console -e test doctrine:schema:validate

  lint:
    name: Docker Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
      - name: Validate the edge Caddyfile
        run: deploy/edge/validate.sh

  deploy:
    name: Deploy
    needs:
      - tests
      - lint
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
