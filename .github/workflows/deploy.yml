name: Deploy

# dev → preprod, main → prod, on the VPS (docs/deployment.md). Called by CI once the tests
# pass on a push; run it by hand to redeploy a branch's head.
on:
  workflow_call: ~
  workflow_dispatch: ~

permissions:
  contents: read

env:
  IMAGE: ghcr.io/maxime-urbanski/kale-borroka-sf

# Actions pinned by commit: these jobs hold packages: write and the deploy keys
# (Dependabot keeps them up to date).
jobs:
  image:
    name: Image
    # A manual run from another branch has nowhere to go.
    if: github.ref_name == 'dev' || github.ref_name == 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Built from scratch on every deploy, never from an existing tag nor from the GHA cache:
      # anything else on the repository able to write either would choose the prod image.
      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: frankenphp_prod
          pull: true
          push: true
          tags: ${{ env.IMAGE }}:sha-${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          no-cache: true

  deploy:
    name: Deploy
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    # One deploy at a time per environment, never cancelled halfway.
    concurrency:
      group: deploy-${{ github.ref_name }}
      cancel-in-progress: false
    # Each environment holds its own DEPLOY_SSH_KEY, limited to its branch.
    environment:
      name: ${{ github.ref_name == 'main' && 'production' || 'preprod' }}
      url: ${{ github.ref_name == 'main' && 'https://kale-borroka-records.com' || 'https://preprod.kale-borroka-records.com' }}
    env:
      TAG: ${{ github.ref_name == 'main' && 'prod' || 'preprod' }}
    steps:
      # The key's forced command (deploy/deploy.sh) pins the environment: it only takes the SHA.
      - name: Deploy on the VPS
        env:
          SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy
          ssh -i ~/.ssh/deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "deploy@$SSH_HOST" "$GITHUB_SHA"
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Only once the environment runs it.
      - name: Tag the environment
        run: docker buildx imagetools create --tag "$IMAGE:$TAG" "$IMAGE:sha-$GITHUB_SHA"
