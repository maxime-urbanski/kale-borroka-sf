name: Deploy

# dev → preprod, main → prod, on the VPS (docs/deployment.md). A push to dev comes from a
# merged pull request, whose CI ran; main only receives dev.
on:
  push:
    branches:
      - dev
      - main
  workflow_dispatch: ~

permissions:
  contents: read

# One deploy at a time per environment, never cancelled halfway.
concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/maxime-urbanski/kale-borroka-sf

jobs:
  image:
    name: Image
    # A manual run from another branch has nowhere to go.
    if: github.ref_name == 'dev' || github.ref_name == 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # main fast-forwarded to a commit already deployed on preprod ships that very image.
      - name: Look for an image of this commit
        id: existing
        run: |
          if docker buildx imagetools inspect "$IMAGE:sha-$GITHUB_SHA" >/dev/null 2>&1; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Build and push
        if: steps.existing.outputs.found != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          target: frankenphp_prod
          pull: true
          push: true
          tags: ${{ env.IMAGE }}:sha-${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=deploy
          cache-to: type=gha,scope=deploy,mode=max
      - name: Tag the environment
        run: >-
          docker buildx imagetools create
          --tag "$IMAGE:${{ github.ref_name == 'main' && 'prod' || 'preprod' }}"
          "$IMAGE:sha-$GITHUB_SHA"

  deploy:
    name: Deploy
    needs: image
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref_name == 'main' && 'production' || 'preprod' }}
      url: ${{ github.ref_name == 'main' && 'https://kale-borroka-records.com' || 'https://preprod.kale-borroka-records.com' }}
    env:
      TARGET: ${{ github.ref_name == 'main' && 'prod' || 'preprod' }}
    steps:
      # The key is the forced command deploy/deploy.sh on the VPS: these two words are all
      # it can send.
      - name: Deploy on the VPS
        env:
          SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy
          ssh -i ~/.ssh/deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "deploy@$SSH_HOST" "$TARGET $GITHUB_SHA"
