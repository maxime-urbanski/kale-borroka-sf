<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<style>:focus-visible{outline:3px solid #111010!important;outline-offset:3px;box-shadow:0 0 0 3px #f3eee4}::placeholder{color:#5b5750;opacity:1}@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}</style>
</helmet>
<header style="position:relative;z-index:5;background:#f3eee4;color:#111010;font-family:'Archivo',system-ui,sans-serif;border-bottom:3px solid #111010">
  <a href="#contenu" style="position:absolute;left:8px;top:-80px;z-index:10;background:#111010;color:#f3eee4;padding:12px 16px;font-weight:800;font-size:14px;text-transform:uppercase;letter-spacing:.05em" style-focus="top:8px">Aller au contenu</a>
  <sc-if value="{{desktop}}" hint-placeholder-val="{{true}}">
    <div style="background:#111010;color:#f3eee4;font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.08em;text-transform:uppercase;display:flex;justify-content:space-between;padding:8px 40px">
      <span>Livraison offerte dès 60 € — France métropolitaine</span>
      <span>Label &amp; distro · punk · antifa · DIY</span>
    </div>
    <div style="display:flex;align-items:center;gap:28px;padding:10px 40px">
      <a href="#" style="display:block;flex:none"><img src="uploads/logo-631dd26c.jpg" alt="Kale Borroka Riot Records — accueil" style="height:72px;width:auto;display:block;mix-blend-mode:multiply"></a>
      <nav aria-label="Navigation principale" style="display:flex;gap:4px;align-items:stretch">
        <a href="#" style="display:flex;align-items:center;height:48px;padding:0 14px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;font-size:15px;text-decoration:none;color:#111010;border-bottom:4px solid {{prodLine}}">Nos productions</a>
        <button type="button" aria-expanded="{{megaExp}}" aria-controls="menu-catalogue" style="font-family:inherit;background:none;border-top:0;border-left:0;border-right:0;cursor:pointer;display:flex;align-items:center;gap:6px;height:48px;padding:0 14px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;font-size:15px;color:#111010;border-bottom:4px solid {{catLine}}">Catalogue <i aria-hidden="true" class="bi bi-chevron-down" style="font-size:12px"></i></button>
      </nav>
      <form role="search" style="flex:1;max-width:420px;display:flex;align-items:center;gap:10px;height:48px;border:2px solid #111010;padding:0 0 0 14px;background:#f3eee4">
        <label for="recherche" style="display:flex"><i aria-hidden="true" class="bi bi-search"></i><span style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap">Rechercher dans la boutique</span></label><input id="recherche" type="search" placeholder="Groupe, album, label, réf. KBR…" style="flex:1;min-width:0;height:100%;border:0;background:none;font-family:inherit;font-size:16px;color:#111010;padding:0 10px 0 0">
      </form>
      <div style="margin-left:auto;display:flex;gap:6px;align-items:center">
        <a href="#" style="display:flex;align-items:center;gap:8px;height:48px;padding:0 12px;font-weight:700;font-size:15px;color:#111010;text-decoration:none"><i aria-hidden="true" class="bi {{accIcon}}" style="font-size:20px"></i>{{accLabel}}</a>
        <a href="#" aria-label="Panier, {{cart}} articles" style="display:flex;align-items:center;gap:10px;height:48px;padding:0 16px;background:#111010;color:#f3eee4;font-weight:800;text-transform:uppercase;letter-spacing:.05em;font-size:14px;text-decoration:none"><i aria-hidden="true" class="bi bi-bag" style="font-size:18px"></i>Panier<span style="min-width:24px;height:24px;padding:0 6px;background:#c4161c;color:#f3eee4;font-family:'IBM Plex Mono',monospace;font-size:13px;display:grid;place-items:center">{{cart}}</span></a>
      </div>
    </div>
    <sc-if value="{{mega}}" hint-placeholder-val="{{false}}">
      <div id="menu-catalogue" style="position:absolute;top:100%;left:330px;margin-top:3px;width:620px;background:#111010;color:#f3eee4;display:grid;grid-template-columns:1fr 1fr;gap:0 32px;padding:24px 28px;box-shadow:8px 8px 0 #c4161c">
        <sc-for list="{{formats}}" as="f" hint-placeholder-count="7">
          <a href="#" style="display:flex;justify-content:space-between;align-items:center;min-height:48px;border-bottom:1px solid #3a3734;color:#f3eee4;text-decoration:none;font-family:'Anton',Impact,sans-serif;font-size:22px;letter-spacing:.03em;text-transform:uppercase">{{f.n}}<span style="font-family:'IBM Plex Mono',monospace;font-size:12px;color:#b9b2a6">{{f.c}}</span></a>
        </sc-for>
        <a href="#" style="display:flex;align-items:center;gap:8px;min-height:48px;color:#f3eee4;font-weight:700;font-size:14px;text-transform:uppercase;letter-spacing:.06em">Tout le catalogue <i aria-hidden="true" class="bi bi-arrow-right"></i></a>
      </div>
    </sc-if>
  </sc-if>
  <sc-if value="{{mobile}}" hint-placeholder-val="{{false}}">
    <div style="display:flex;align-items:center;gap:4px;padding:6px 8px 6px 14px;height:64px">
      <img src="uploads/logo-631dd26c.jpg" alt="Kale Borroka Riot Records" style="height:52px;width:auto;mix-blend-mode:multiply;display:block">
      <span style="flex:1"></span>
      <button aria-label="Rechercher" style="width:44px;height:44px;display:grid;place-items:center;background:none;border:0;font-size:20px;color:#111010"><i aria-hidden="true" class="bi bi-search"></i></button>
      <button aria-label="Panier, {{cart}} articles" style="position:relative;width:44px;height:44px;display:grid;place-items:center;background:none;border:0;font-size:20px;color:#111010"><i aria-hidden="true" class="bi bi-bag"></i><span style="position:absolute;top:4px;right:2px;min-width:18px;height:18px;padding:0 4px;background:#c4161c;color:#f3eee4;font-family:'IBM Plex Mono',monospace;font-size:11px;display:grid;place-items:center">{{cart}}</span></button>
      <button aria-label="Ouvrir le menu" aria-expanded="false" aria-controls="menu-mobile" style="width:44px;height:44px;display:grid;place-items:center;background:#111010;border:0;font-size:22px;color:#f3eee4"><i aria-hidden="true" class="bi bi-list"></i></button>
    </div>
  </sc-if>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:140},&quot;mobile&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;logged&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;mega&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;cart&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:3,&quot;tsType&quot;:&quot;number&quot;},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;&quot;,&quot;prod&quot;,&quot;cat&quot;],&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const mobile = !!p.mobile;
    return {
      desktop: !mobile, mobile,
      mega: !!p.mega, megaExp: p.mega ? 'true' : 'false',
      cart: p.cart ?? 3,
      accLabel: p.logged ? 'Mon compte' : 'Connexion',
      accIcon: p.logged ? 'bi-person-check' : 'bi-person',
      prodLine: p.active === 'prod' ? '#c4161c' : 'transparent',
      catLine: p.active === 'cat' ? '#c4161c' : 'transparent',
      formats: [
        { n: 'Vinyles LP', c: '148' }, { n: 'EP / 7"', c: '64' }, { n: 'CD', c: '212' },
        { n: 'Cassettes', c: '57' }, { n: 'Fanzines', c: '38' }, { n: 'Livres', c: '21' },
        { n: 'Merch', c: '44' }
      ]
    };
  }
}
</script>
</body>
</html>
