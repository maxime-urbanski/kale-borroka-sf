symfonycasts_reset_password:
    request_password_repository: App\Repository\ResetPasswordRequestRepository
    # A link is valid for an hour (« Le lien expire dans 1 heure »), but « Renvoyer le lien »
    # may ask for another after 15 minutes (4 mails an hour at most per account): the default
    # throttle (an hour) would silently send nothing. Every link of the account dies once one
    # of them is used.
    lifetime: 3600
    throttle_limit: '%app.reset_password.throttle_limit%'
