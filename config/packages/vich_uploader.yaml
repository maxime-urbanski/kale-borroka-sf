vich_uploader:
    db_driver: orm
    metadata:
        type: attribute
        
    mappings:
        albums:
            uri_prefix: /albums
            upload_destination: '%kernel.project_dir%/public/upload/albums'
            namer: Vich\UploaderBundle\Naming\SmartUniqueNamer
            inject_on_load: false
            delete_on_update: true
            delete_on_remove: true
            
        artists:
            uri_prefix: /upload/artists
            upload_destination: '%kernel.project_dir%/public/upload/artists'
            namer: Vich\UploaderBundle\Naming\SmartUniqueNamer
            inject_on_load: false
            delete_on_update: true
            delete_on_remove: true

        labels:
            uri_prefix: /upload/labels
            upload_destination: '%kernel.project_dir%/public/upload/labels'
            namer: Vich\UploaderBundle\Naming\SmartUniqueNamer
            inject_on_load: false
            delete_on_update: true
            delete_on_remove: true

        media_object:
            uri_prefix: /media
            upload_destination: '%kernel.project_dir%/public/media'
            namer: Vich\UploaderBundle\Naming\SmartUniqueNamer
            delete_on_update: true
            delete_on_remove: true
