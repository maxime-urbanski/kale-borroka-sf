vich_uploader:
    db_driver: orm
    metadata:
        type: attribute
        
    mappings:
        albums:
            uri_prefix: /albums
            upload_destination: '%kernel.project_dir%/public/upload/albums'
            namer: Vich\UploaderBundle\Naming\SmartUniqueNamer
            inject_on_load: false
            delete_on_update: true
            delete_on_remove: true
            
        media_object:
            uri_prefix: /media
            upload_destination: '%kernel.project_dir%/public/media'
            namer: Vich\UploaderBundle\Naming\SmartUniqueNamer
            delete_on_update: true
            delete_on_remove: true

        # Label expense invoices: outside public/ on purpose, served by
        # ExpenseCrudController::invoice() to admins only. uri_prefix is never used.
        expense_invoice:
            uri_prefix: /admin/expense
            upload_destination: '%kernel.project_dir%/private/invoices'
            namer: Vich\UploaderBundle\Naming\SmartUniqueNamer
            delete_on_update: true
            delete_on_remove: true

# Tests upload for real: keep their files out of public/ (rolled-back transactions do not
# delete files).
when@test:
    vich_uploader:
        mappings:
            albums:
                upload_destination: '%kernel.project_dir%/var/test-uploads/albums'
            media_object:
                upload_destination: '%kernel.project_dir%/var/test-uploads/media'
            expense_invoice:
                upload_destination: '%kernel.project_dir%/var/test-uploads/invoices'
