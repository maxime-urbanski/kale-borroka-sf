framework:
    router:
        utf8: true

        # How to generate URLs in non-HTTP contexts, such as CLI commands: each deployed
        # environment sets its own https:// domain (docs/deployment.md).
        # See https://symfony.com/doc/current/routing.html#generating-urls-in-commands
        default_uri: '%env(DEFAULT_URI)%'

when@prod:
    framework:
        router:
            strict_requirements: null
