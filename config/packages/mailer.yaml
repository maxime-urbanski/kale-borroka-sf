framework:
    mailer:
        dsn: '%env(MAILER_DSN)%'
        # Every mail leaves from the SMTP account's own mailbox: OVH's Zimbra refuses to
        # relay any other sender, and a foreign domain would fail SPF/DMARC anyway.
        headers:
            From: 'Kale Borroka Records <%env(MAILER_DEFAULT_SENDER)%>'
