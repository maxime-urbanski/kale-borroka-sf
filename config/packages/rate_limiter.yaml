framework:
    rate_limiter:
        # « Mot de passe oublié »: 5 requests per client address within 15 minutes. The bundle
        # throttles each account (reset_password.yaml), this stops one address from mailing
        # many inboxes. Behind the edge proxy, the client address comes from X-Forwarded-For
        # (trusted proxies), so visitors do not share a count.
        reset_password:
            policy: sliding_window
            limit: 5
            interval: '15 minutes'
        # Informations page: 3 new e-mails asked for per account within an hour. Each request
        # mails an address the customer types, so the shop must not become a mail cannon.
        email_change:
            policy: sliding_window
            limit: 3
            interval: '1 hour'
