framework:
    html_sanitizer:
        sanitizers:
            # Rich text written in the back office (Trix) and shown to visitors: CMS pages.
            app.rich_text_sanitizer:
                allow_safe_elements: true
                allow_relative_links: true
                allow_relative_medias: true
                allowed_link_schemes: ['http', 'https', 'mailto', 'tel']
