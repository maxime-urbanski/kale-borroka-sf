security:
    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'
    # https://symfony.com/doc/current/security.html#loading-the-user-the-user-provider
    providers:
        # used to reload user from session & other features (e.g. switch_user)
        app_user_provider:
            # No `property`: UserRepository::loadUserByIdentifier() normalises the e-mail.
            entity:
                class: App\Entity\User
    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false
        main:
            lazy: true
            provider: app_user_provider
            custom_authenticator: App\Security\UserAuthenticator
            # 5 failures per account and address within 15 minutes, then even the right
            # password is refused until the window passes (and 25 per address, all
            # accounts together). Symfony's limiter lowercases the username, so changing the
            # case of the e-mail does not reset the count (LoginThrottlingTest). A successful
            # login does not reset it either (Symfony's choice: otherwise logging into one's
            # own account would wipe the per-address count), so failures stay counted until
            # the window passes. The lock serialises parallel attempts, which could otherwise
            # all read the count before any of them updates it. The client address is
            # REMOTE_ADDR: behind a proxy, set SYMFONY_TRUSTED_PROXIES or every visitor shares
            # the proxy's address.
            login_throttling:
                max_attempts: 5
                interval: '15 minutes'
                lock_factory: lock.factory
            # CSRF token required (partials/_post_button.html.twig, token_id 'logout'; EasyAdmin's
            # link puts it in the query string): a link or an image on another site must not
            # log the visitor out.
            logout:
                path: app_logout
                enable_csrf: true
                csrf_token_id: logout
                csrf_parameter: _token
                # where to redirect after logout
                # target: app_any_route

            remember_me:
                secret: '%kernel.secret%'
                lifetime: 604800
                path: /
                always_remember_me: true

            # activate different ways to authenticate
            # https://symfony.com/doc/current/security.html#the-firewall

            # https://symfony.com/doc/current/security/impersonating_user.html
            # switch_user: true

    # Easy way to control access for large sections of your site
    # Note: Only the *first* access control that matches will be used
    access_control:
        - { path: ^/admin, roles: ROLE_ADMIN }
        - { path: ^/mon-compte, roles: ROLE_USER }

when@test:
    security:
        password_hashers:
            # By default, password hashers are resource intensive and take time. This is
            # important to generate secure password hashes. In tests however, secure hashes
            # are not important, waste resources and increase test times. The following
            # reduces the work factor to the lowest possible values.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
