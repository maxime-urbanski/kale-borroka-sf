framework:
    cache:
        # The "app" cache stores to the filesystem (var/share/<env>/pools), shared by the
        # FrankenPHP worker threads and the CLI, so a change made by a console command
        # invalidates what the web workers serve. APCu would not be shared with the CLI;
        # Redis is only worth it with several servers.
        # cache:clear keeps var/share: the prod image starts empty, but after a template
        # change on a long-lived container run `bin/console cache:pool:clear cache.fragments`.
        pools:
            # Rendered HTML fragments that are the same for every visitor ({% cache %} in
            # Twig). Tagged by entity (App\Cache\EntityCacheInvalidator clears the tags
            # when Doctrine flushes a change), the lifetime is only a safety net.
            cache.fragments:
                adapter: cache.app
                tags: true
                default_lifetime: 3600

# In dev a fragment would outlive template edits; tests must not see a previous run.
# The array adapter is emptied between requests, so nothing is cached across them.
when@dev: &no_fragment_cache
    framework:
        cache:
            pools:
                cache.fragments:
                    adapter: cache.adapter.array
                    tags: true

when@test: *no_fragment_cache
