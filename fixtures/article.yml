App\Entity\Article:
    article_template (template):
        quantity: '<numberBetween(1,50)>'
        price: '<numberBetween(700,2500)>'
        edition: '@edition_*'

    article_QuartierMaudit (extends article_template):
        quantity: 2
        price: 1000
        edition: '@edition_QuartierMaudit_LP'

    # Same pressing offered twice: new and second-hand, at different prices.
    article_QuartierMaudit_occasion (extends article_template):
        quantity: 1
        price: 600
        edition: '@edition_QuartierMaudit_LP'
        condition: !php/enum App\Enum\ItemCondition::USED

    article_QuartierMaudit_rouge (extends article_template):
        quantity: 5
        price: 2500
        edition: '@edition_QuartierMaudit_LP_rouge'

    article_{1..50} (extends article_template):
