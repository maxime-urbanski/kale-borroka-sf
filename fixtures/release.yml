App\Entity\Release:
    release_template (template):
        stock: '<numberBetween(0,50)>'
        price: '<numberBetween(700,2500)>'
        color: '<randomElement(["noir", "rouge", "splatter vert/noir", null])>'
        published: true

    release_QuartierMaudit (extends release_template):
        name: 'Brixton Cats - Quartier Maudit'
        sku: 'KBR-QM-LP-BLK'
        stock: 2
        price: 1000
        format: '<(App\Enum\ReleaseFormat::VINYL_12)>'
        color: 'noir'
        album: '@Quartier_Maudit'
        label: '@FireAndFlames'

    release_QuartierMaudit_red (extends release_template):
        name: 'Brixton Cats - Quartier Maudit (rouge)'
        sku: 'KBR-QM-LP-RED'
        stock: 1
        price: 1500
        format: '<(App\Enum\ReleaseFormat::VINYL_12)>'
        color: 'rouge'
        limitedTo: 300
        album: '@Quartier_Maudit'
        label: '@FireAndFlames'

    # One pressing per generated album (see album.yml). Formats cycle so that, combined
    # with the album release types, every catalogue section has content.
    # KBR productions: no third-party label, catalogue number = production number.
    release_{1..10} (extends release_template):
        album: '@album_<current()>'
        sku: 'KBR-REL-<current()>'
        name: '<($album->fullName())>'
        format: '<(App\Enum\ReleaseFormat::cases()[$current % 5])>'
        catalogNumber: '<($album->getKbrProductionId())>'

    release_{11..50} (extends release_template):
        album: '@album_<current()>'
        sku: 'KBR-REL-<current()>'
        name: '<($album->fullName())>'
        format: '<(App\Enum\ReleaseFormat::cases()[$current % 5])>'
        label: '@label_<current()>'

    release_draft (extends release_template):
        name: 'Brouillon jamais publié'
        album: '@album_11'
        format: '<(App\Enum\ReleaseFormat::CD)>'
        label: '@label_11'
        published: false
