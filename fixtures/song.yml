    # Ten tracks per generated album, credited to the album's artist (see album.yml).
    song_{1..500} (extends song_template):
        track: '<(($current - 1) % 10 + 1)>'
        albums: ['@album_<(intdiv($current - 1, 10) + 1)>']
        artist: ['@artist_<(intdiv($current - 1, 10) % 25 + 1)>']
