artists:
    65_mines_street:
        name: "65 Mines Street"
        country: FR
        links: ["https://65minesstreet.bandcamp.com"]
        description: "65 Mines Street est un groupe d'Audincourt (Doubs), formé en 2009, qui joue un ska et un reggae teintés de rock'n'roll, de garage et de surf. Ses cinq membres viennent de groupes de la scène ska française comme Two Tone Club, Bobby Sixkiller et Taste in Vibes. Le groupe a publié ensuite Fix the Clock! (2013) et Sick & Bitchin' (2015)."
    86_crew:
        name: "8°6 Crew"
        country: FR
        links: ["https://fr.wikipedia.org/wiki/8%C2%B06_Crew"]
        description: "8°6 Crew est un groupe de ska et de reggae skinhead de Paris et de sa banlieue, formé en 1995. D'abord mêlé de streetpunk et de oi!, le groupe s'en éloigne en intégrant une section de cuivres. Ses albums incluent « Bad Bad Reggae » (1999), « Menil'Express » (2001), « Old Reggae Friends » (2010) et « Working Class Reggae » (2016)."
    all_this_mess:
        name: "All This Mess"
        country: FR
        links: ["https://allthismess.bandcamp.com"]
        description: "All This Mess est un groupe punk parisien formé en 2015. Il joue un punk-rock aux accents anarcho-punk des années 80."
    asbestos:
        name: "Asbestos"
        country: CA
        links: ["https://asbestosmtl.bandcamp.com"]
        description: "Groupe oi! francophone de Montréal (Québec), aux influences post-punk et hardcore. Line-up du premier EP : Jeeps (chant), Sansan (guitare solo, chœurs), Franx (guitare rythmique), Éric Sédition (basse, chœurs) et Mathieu UT (batterie)."
    binouze_metamphe_gang:
        name: "Binouze Metamphe Gang"
        country: FR
        links: ["https://soundcloud.com/bmgsound"]
        description: "Groupe punk oi! français, actif sur la scène parisienne au début des années 2010."
    block_h_no_leader:
        name: "Block H / No Leader"
        country: FR
        description: "Split CD entre deux groupes français : Block H, punk rock engagé, et No Leader, groupe punk oi! de Vitré (Ille-et-Vilaine) qui joue avec une boîte à rythmes. Chaque groupe y joue cinq titres."
    bombshell_rocks:
        name: "Bombshell Rocks"
        country: SE
        links: ["https://en.wikipedia.org/wiki/Bombshell_Rocks", "https://shop.piratespressrecords.com/pages/bombshell-rocks"]
        description: "Groupe punk rock suédois fondé en 1995 à Västerås. Generation Tranquilized marque le retour du chanteur d'origine Mårten Cedergran."
    cartouche:
        name: "Cartouche"
        country: FR
        links: ["https://www.cartouche.punkrock.fr/en/albums/2014-bread-and-roses/", "https://appelauxluttes.bandcamp.com/album/cartouche-bread-roses"]
        description: "Cartouche est un groupe punk rock mélodique français, présenté par Discogs comme venant de Paris et d'Agen. Après « À corps perdu » (2009), il sort « Bread & Roses » en 2014 puis « À venir » en 2017, avec des textes en français, en anglais et en allemand."
    death_or_glory:
        name: "Death Or Glory"
        country: FR
        links: ["https://deathorglory1.bandcamp.com"]
        description: "Death Or Glory est un trio punk-rock de Rennes formé en 2010 par Giole (chant, guitare) et Tony (basse), tous deux anciens de Skuds and Panic People, avec Tommy Gun (batterie, ex-Dead City Walkers). Influencé par The Clash, The Ruts, les Redskins ou Gang of Four, le groupe a beaucoup tourné dans la scène DIY en France, en Belgique, en Suisse et en Allemagne. Deuxième album : « Fearless » (2016)."
    enraged_minority:
        name: "Enraged Minority"
        country: DE
        links: ["https://www.fireandflames.com/en/label/bands/enraged-minority/", "https://enragedminority.bandcamp.com"]
        description: "Enraged Minority est un groupe de streetpunk de Fribourg-en-Brisgau (Allemagne), fondé à l'automne 2007 à Rheinfelden. Sa musique mêle streetpunk, hardcore punk, ska et rock'n'roll, sur des textes de lutte des classes. Discographie : un premier album en 2010, « Antitude » (2014, Mad Butcher Records) puis « A World To Win » (2018)."
    gilbert_et_ses_problemes:
        name: "Gilbert et ses Problèmes"
        country: FR
        links: ["https://gilbertetsesproblemes.bandcamp.com"]
        description: "Groupe ska-punk de Montpellier. Sur En Transit, le line-up compte Lolo (chant), Fofo et Jiv (guitares), Drik (basse), Beavis (batterie) et Dim (saxophone)."
    harbour_rebels:
        name: "Harbour Rebels"
        country: DE
        links: ["https://harbourrebels.bandcamp.com", "https://harbourrebels.com/", "https://harbourrebels.com"]
        description: "Groupe de streetpunk de Hambourg fondé à l'été 2017, mêlant streetpunk, ska, Oi! et hardcore, avec un positionnement ouvertement antiraciste. Premier album « Leinen los » en 2018, suivi de l'EP « On A Journey » (2020) puis de l'album « Rebels Are Back » (2022)."
    helem:
        name: "Helem"
        country: IL
        links: ["https://helem.bandcamp.com"]
        description: "Helem (חלם) est un groupe de punk rock antifasciste de Tel Aviv-Jaffa, qui chante en hébreu. Le groupe est formé de Ran Deri (chant), Ran Weizman (guitare), Arcadi Maidanik (basse) et Arik Baraz (batterie). Ses textes dénoncent les discriminations et appellent à la paix au Proche-Orient."
    hvb:
        name: "HVB"
        country: FR
        links: ["https://hvbmusic.bandcamp.com"]
        description: "HVB (Hooligans Valstar Band) est un groupe de street-punk/oi! formé en janvier 2009 à Saint-Aubin-de-Baubigné, dans les Deux-Sèvres, troisième groupe « sur les terres » de l'Antifa Saint Aub' Crew. Ses textes parlent de vécu, de mélancolie et de questions sociales comme la prison, la jeunesse ou la vie à la rue. En mai 2012, Arn'oi (ex-Yuka) a remplacé Chris dans le groupe."
    kabal_la_revolte:
        name: "Kabal...La Révolte"
        country: FR
        description: "Kabal...La Révolte est un groupe de punk-rock chanté en français, originaire du sud du Finistère (pays bigouden, Quimper), actif de juillet 2008 à 2012. Ses textes abordent surtout les problèmes sociaux en France, l'écologie, les guerres et la bêtise humaine. Le groupe est apparu sur la compilation Breizh Disorder vol. 7 de Mass Productions et a joué des Côtes-d'Armor à la Normandie en passant par Paris."
    knock_out:
        name: "Knock Out"
        country: ES
        links: ["https://knockoutmadrid.bandcamp.com"]
        description: "Knock Out (aussi écrit Knockout) est un groupe de Rock & Oi! de Madrid formé en 2013 par des membres de plusieurs groupes punk madrilènes. Il revendique l'influence de l'Oi! anglaise classique, de l'Oi! française des années 80 et du streetpunk canadien."
    krav_boca:
        name: "Krav Boca"
        country: FR
        links: ["https://kravboca.com", "https://kravboca.bandcamp.com"]
        description: "Krav Boca est un collectif punk-rap franco-gréco-marocain formé à Toulouse en 2014. Le groupe mêle rap, punk, metal et mandoline, avec des textes en français et en grec, et fonctionne en DIY avec un large réseau de labels indépendants à travers le monde."
    la_cruz:
        name: "La Cruz"
        country: ES
        links: ["https://lacruz.bandcamp.com"]
        description: "Groupe Oi! de Madrid formé en 2017, influencé par la Oi! anglaise des années 80. Le groupe chante en espagnol."
    left_for_dead:
        name: "Left For Dead"
        country: GB
        links: ["https://leftfordead3.bandcamp.com"]
        description: "Groupe punk de Hackney (Londres) formé en 1996. Malgré de nombreux changements de line-up, il joue un punk rock old school DIY et antifasciste, mélodique et rageur."
    les_gueules_noires:
        name: "Les Gueules Noires"
        country: FR
        links: ["https://lesgueulesnoires.bandcamp.com"]
        description: "Groupe ska-punk du Nord de la France, présenté comme originaire de Valenciennes (Discogs) et basé à Lille (Bandcamp)."
    les_trois_huit:
        name: "Les Trois Huit"
        country: FR
        links: ["https://durerealite.bandcamp.com/album/les-trois-huit"]
        description: "Les Trois Huit est un groupe de oi! antifasciste de Grenoble. Son premier album, sans titre, sort en 2015 en coproduction entre plusieurs labels de la scène (Rusty Knife, Fire and Flames, Dure Réalité, General Strike, FFC Productions), suivi en 2016 de « Assigné.es à résistance »."
    messed_up:
        name: "Messed Up"
        country: BY
        links: ["https://messedupgrlzzz.bandcamp.com"]
        description: "Messed Up est un groupe punk féminin fondé en 2015 à Grodno, en Biélorussie, présenté comme le premier groupe punk entièrement féminin du pays. Ses textes, en russe, parlent de racisme, d'homophobie et d'ignorance sociale. Contraintes de quitter la Biélorussie après la répression de 2020, les musiciennes se sont installées à Varsovie ; le groupe s'est séparé en mai 2025."
    moscow_death_brigade:
        name: "Moscow Death Brigade"
        country: RU
        links: ["https://moscowdeathbrigade.com", "https://moscowdeathbrigade.bandcamp.com"]
        description: "Moscow Death Brigade est un groupe russe fondé en 2007, qui mêle hip-hop hardcore, punk et musique électronique sous l'étiquette « Circle Pit Hip-Hop ». Ses trois membres masqués (les rappeurs Vlad Boltcutter et Ski Mask G, et DJ Solid Seb) sont issus de la scène graffiti et des mouvements sociaux DIY. Leurs textes, en anglais, sont antifascistes et contre le racisme, le sexisme et la guerre."
    non_servium_bull_brigade:
        name: "Non Servium / Bull Brigade"
        links: ["https://bullbrigade.bandcamp.com"]
        description: "Split entre deux piliers antifascistes de la scène Oi!/streetpunk : Non Servium, groupe Oi! de Móstoles (Madrid) formé en 1997, et Bull Brigade, groupe de streetpunk de Turin formé en 2006 sur les cendres de Banda del Rione et Youngang."
    resaka_sonora:
        name: "Resaka Sonora"
        country: FR
        links: ["https://resakasonora.bandcamp.com"]
        description: "Resaka Sonora est un groupe de ska-punk de Bordeaux, fondé en 2011 par une bande d'amis. Cette formation de neuf musiciens se revendique « combat ska » et chante en français, en espagnol et en italien des textes politiques et internationalistes. Premier album, Buenaventura, en 2015."
    revenja:
        name: "Revenja"
        country: ES
        description: "Groupe streetpunk/oi! antifasciste de Barcelone, qui chante en catalan."
    s_molest:
        name: "S-Molest"
        country: IT
        description: "S-Molest est un groupe oi! de Rome, apparu en 2007 et issu du quartier de San Lorenzo. Le groupe a joué sur de nombreuses scènes italiennes et étrangères, notamment aux côtés de The Oppressed et des Angelic Upstarts. Il est connu pour son titre « Sbronza Molesta »."
    saccage:
        name: "Saccage"
        country: FR
        links: ["https://saccageoi.bandcamp.com"]
        description: "Saccage est un groupe d'oi! antifasciste parisien, issu de la nouvelle génération de la scène redskin. Il a sorti une première démo de quatre titres en octobre 2023, enregistrée au Disvlar Studio."
    sempre_peggio:
        name: "Sempre Peggio"
        country: IT
        links: ["https://semprepeggio.bandcamp.com"]
        description: "Groupe Oi! de Milan actif depuis 2015, ouvertement antifasciste. Premier album « Sempre Peggio » en 2016 chez Anfibio Records."
    sharp_cut:
        name: "Sharp Cut"
        country: DE
        links: ["https://sharpxcut.bandcamp.com"]
        description: "Sharp Cut est un groupe d'oi! anarchiste de Leipzig, formé à l'été 2016. Le groupe joue un skinhead rock'n'roll rugueux et mélodique, à l'attitude strictement antifasciste et de classe, et dénonce le sexisme, l'homophobie, la transphobie et le racisme dans la scène punk."
    skuds_and_panic_people:
        name: "Skuds and Panic People"
        country: FR
        description: "Skuds and Panic People est un groupe de Rennes qui mêlait punk-rock et ska, avec des touches de hardcore et des textes politiques. Deux de ses membres, Giole et Tony, ont ensuite fondé Death Or Glory en 2010."
    snob_city_boys:
        name: "Snob City Boys"
        country: DE
        links: ["https://snobcityboys.bandcamp.com"]
        description: "Snob City Boys est un groupe d'Oi! antifasciste de Wiesbaden, capitale de la Hesse, fondé à l'automne 2017 autour du chanteur Mighty Maik. Il s'inspire de l'Oi! britannique de la fin des années 70, avec des refrains à reprendre en chœur et des textes contre l'exclusion, la marchandisation et l'oppression."
    stumbling_pins:
        name: "Stumbling Pins"
        country: DE
        links: ["https://stumblingpins.bandcamp.com"]
        description: "Stumbling Pins est un groupe punk de Kiel (Allemagne), qui joue un streetpunk mélodique aux textes directs et engagés. Après un premier album, « Aged Colours And Behaviours » (2011), et l'EP acoustique « Lifetime Crisis » (2014), le groupe a tourné en Lituanie, en Estonie, en Ukraine et en Russie."
    t_killas:
        name: "T-Killas"
        country: DE
        links: ["https://t-killas.bandcamp.com"]
        description: "Les T-Killas sont un groupe de ska d'Aschaffenburg (Bavière), actif depuis 2003. Inspirés par The Clash, The Specials et les Redskins, ils mélangent ska, mod et punk avec orgue et saxophone. Leur premier album est sorti en 2014."
    the_last_minute:
        name: "The Last Minute"
        country: HU
        description: "Groupe de ska 2-tone teinté d'oi! formé à Budapest (Hongrie) en 2005, avec l'ambition de réveiller la scène ska underground hongroise."
    the_midnight_rovers:
        name: "The Midnight Rovers"
        country: FR
        links: ["https://themidnightrovers.bandcamp.com"]
        description: "The Midnight Rovers est un groupe de rockabilly de la banlieue sud de Paris, formé fin 2006. Le groupe mêle le rockabilly des années 50-60 et le rock français des années 80, avec des textes engagés sur la vie et la violence sociale en banlieue. Marylou chante sur le premier album, Nico lui succède sur « Rockin' Class »."
    tulamort:
        name: "Tulamort"
        country: FR
        links: ["https://tulamort.bandcamp.com"]
        description: "Tulamort est un groupe de punk des rues parisien formé début 2006, en pleine mobilisation contre les mesures antisociales du gouvernement, par d'anciens membres de Ya Basta!, Cartouche et Travailleurs de la Nuit. Sa musique navigue entre oi!, punk-hardcore et ska, avec des textes politiques. Discographie : un EP et un live en 2008, Main d'œuvre internationale (2013) puis Des hauts et des bars (2017)."
    union_blood:
        name: "Union Blood"
        country: ES
        links: ["https://unionblood.bandcamp.com"]
        description: "Groupe streetpunk/Oi! de La Corogne (Galice), formé à l'été 2016. Le groupe revendique l'influence de Cock Sparrer, Evil Conduct, Vanilla Muffins ou The Business, avec des textes sur la fraternité, le football et la lutte."
    union_thugs:
        name: "Union Thugs"
        country: CA
        links: ["https://unionthugs.bandcamp.com"]
        description: "Union Thugs est un groupe de Montréal (Québec) qui joue un mélange de folk et d'oi!, porté par l'accordéon, autour des chants ouvriers et révolutionnaires. Ses membres sont passés par des groupes comme Action Sedition, Riot Porn ou Mayday et militent à l'IWW, au COBP (Collectif opposé à la brutalité policière) et chez les RASH. Le groupe se présente comme « d'abord des travailleurs, ensuite des musiciens »."
    various_artists:
        name: "Various Artists"
    wasted_youth:
        name: "Wasted Youth"
        country: DE
        links: ["https://www.facebook.com/wastedyouthsghc"]
        description: "Groupe hardcore punk de Schwäbisch Gmünd (Bade-Wurtemberg), formé en 2008, au positionnement ouvertement de gauche et antifasciste. Premier album « Stay Free » fin 2010 chez Diffidati Records / Casual Records."
    ya_basta:
        name: "Ya Basta !"
        country: FR
        links: ["https://yabasta.bandcamp.com"]
        description: "Ya Basta ! est un groupe militant de la banlieue parisienne, formé en 1993 par Ol et Cidou, qui mêle ska, punk, oi! et rocksteady avec des textes libertaires. Ol écrivait l'essentiel des paroles et Cidou composait la musique ; la dernière formation comptait deux chanteurs et des cuivres (trombone, saxophone). Discographie : split avec Action Directe (1999), Lucha y fiesta (2002), Toujours debout (2004) et Sans retour (2006)."
    yuka:
        name: "Yuka"
        country: FR
