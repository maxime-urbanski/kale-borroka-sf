# Stock de Kale Borroka Records, chargé en base par `bin/console app:catalog:import`
# (ajouter --dry-run pour tout valider sans rien enregistrer).
#
# L'import crée ce qui manque et ne touche jamais à l'existant : labels, styles et artistes
# sont retrouvés par nom, albums par artiste + nom, disques par SKU. Un disque déjà importé
# garde donc son stock et son prix : corriger ce fichier après coup ne change rien en base,
# passer par l'admin. Ajouter un pressage (nouveau SKU) à un album existant fonctionne.
#
# Données recherchées sur Discogs / Bandcamp le 2026-10-01 ; chaque album indique ses sources
# et ce qui reste à vérifier (couleur exacte du pressage en stock, notamment).
#
# albums[].type      album, ep, single, split, compilation, live
# albums[].date      AAAA-MM-JJ, AAAA-MM ou AAAA
# albums[].production  numéro KBR#001 des productions du label
# tracks[].duration  m:ss ou secondes ; tracks[].artist (compilations, splits) : clé de artists ou nom
# releases[].format  vinyl_12, vinyl_10, vinyl_7, cd, cassette
# releases[].price   en centimes, sinon le prix par défaut du format ci-dessous

# Prix par défaut, en centimes.
prices:
    vinyl_12: 2000
    vinyl_10: 1500
    vinyl_7: 600
    cd: 1000
    cassette: 800

